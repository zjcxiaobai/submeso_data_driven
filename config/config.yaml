seed: 42
device: auto
data:
  x_path: data/processed/upper/X.npy
  y_path: data/processed/upper/y.npy
  temporal_offsets:
  - -5
  - -4
  - -3
  - -2
  - -1
  - 0
  split:
    train: 0.8
    val: 0.1
    test: 0.1
  batch_size: 64
  num_workers: 4
  pin_memory: true
  normalize_x: true
  normalize_y: true
model:
  input_channels: 8
  latent_channels: 4
  height: 20
  width: 40
  spatial_channels:
  - 64
  - 128
  - 192
  temporal_channels: 192
  temporal_layers: 5
  decoder_channels:
  - 64
  - 32
  dropout: 0.15
train:
  epochs: 250
  lr: 0.001
  scheduler_factor: 0.5
  scheduler_patience: 10
  scheduler_min_lr: 0.00001
  weight_decay: 0.0001
  patience: 40
  loss: huber
  checkpoint: _src/analysis/model_analysis/outputs_final/temporal_bottleneck.pt
  history_csv: _src/analysis/model_analysis/outputs_final/history.csv
output:
  dir: _src/analysis/model_analysis/outputs_final
  predictions: _src/analysis/model_analysis/outputs_final/test_predictions_denorm.npz
  r2_series: _src/analysis/model_analysis/outputs_final/test_r2_series.csv
  summary: _src/analysis/model_analysis/outputs_final/evaluation_summary.txt
  stats: _src/analysis/model_analysis/outputs_final/norm_stats.npz
