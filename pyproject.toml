[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "submesofluxnet"
version = "0.1.0"
description = "Spatiotemporal neural network for submesoscale vertical heat-flux prediction"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "PyYAML",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
