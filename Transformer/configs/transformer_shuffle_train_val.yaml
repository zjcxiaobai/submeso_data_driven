seed: 42
device: auto

data:
  x_path: data/X.npy
  y_path: data/y.npy
  batch_size: 32
  num_workers: 4
  pin_memory: true
  split:
    train: 0.7
    val: 0.15
    test: 0.15
    shuffle: false
    shuffle_train_val: true
  shuffle_train_loader: true
  normalize_x: true
  normalize_y: true
  stats_scope: train
  stats_path: outputs_transformer_shuffle_train_val/norm_stats.npz
  temporal_offsets: [0]
  augment_x_roll: true

model:
  name: PatchTransformerRegressor
  in_channels: 8
  out_channels: 1
  image_size: 56
  patch_size: 4
  embed_dim: 192
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.15
  attention_dropout: 0.05
  decoder_channels: 96
  decoder_depth: 2

loss:
  name: mse
  domain_mean_weight: 0.05
  high_y_weight: 0.0
  high_y_eps: 0.000001
  gradient_weight: 0.0
  gradient_periodic_x: true

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.001

scheduler:
  name: cosine
  min_lr: 0.000001

train:
  epochs: 300
  amp: true
  grad_clip_norm: 1.0
  early_stopping_patience: 15
  checkpoint_dir: outputs_transformer_shuffle_train_val/checkpoints
  best_checkpoint: outputs_transformer_shuffle_train_val/checkpoints/best.pt
  last_checkpoint: outputs_transformer_shuffle_train_val/checkpoints/last.pt
  history_csv: outputs_transformer_shuffle_train_val/history.csv
  config_snapshot: outputs_transformer_shuffle_train_val/config.yaml
