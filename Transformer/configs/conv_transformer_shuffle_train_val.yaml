seed: 42
device: auto

data:
  x_path: data/X.npy
  y_path: data/y.npy
  batch_size: 48
  num_workers: 4
  pin_memory: true
  split:
    train: 0.7
    val: 0.15
    test: 0.15
    shuffle: false
    shuffle_train_val: true
  shuffle_train_loader: true
  normalize_x: true
  normalize_y: true
  stats_scope: train
  stats_path: outputs_conv_transformer_shuffle_train_val_reg/norm_stats.npz
  temporal_offsets: [0]
  augment_x_roll: true

model:
  name: ConvTransformerUNet
  in_channels: 8
  out_channels: 1
  image_size: 56
  base_channels: 48
  bottleneck_channels: 128
  transformer_depth: 2
  num_heads: 4
  mlp_ratio: 2.0
  kernel_size: 3
  norm: gn
  activation: silu
  conv_dropout: 0.10
  transformer_dropout: 0.20

loss:
  name: mse
  domain_mean_weight: 0.05
  high_y_weight: 0.0
  high_y_eps: 0.000001
  gradient_weight: 0.0
  gradient_periodic_x: true

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.001

scheduler:
  name: cosine
  min_lr: 0.000001

train:
  epochs: 300
  amp: true
  grad_clip_norm: 0.5
  early_stopping_patience: 8
  checkpoint_dir: outputs_conv_transformer_shuffle_train_val_reg/checkpoints
  best_checkpoint: outputs_conv_transformer_shuffle_train_val_reg/checkpoints/best.pt
  last_checkpoint: outputs_conv_transformer_shuffle_train_val_reg/checkpoints/last.pt
  history_csv: outputs_conv_transformer_shuffle_train_val_reg/history.csv
  config_snapshot: outputs_conv_transformer_shuffle_train_val_reg/config.yaml
