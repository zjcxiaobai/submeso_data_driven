seed: 42
device: auto

data:
  x_path: data/train_on_small_domain/upper_40x20/X.npy
  y_path: data/train_on_small_domain/upper_40x20/y.npy
  batch_size: 128
  num_workers: 4
  pin_memory: true
  split:
    train: 0.7
    val: 0.15
    test: 0.15
    shuffle: false
    shuffle_train_val: true
  shuffle_train_loader: false
  normalize_x: true
  normalize_y: true
  stats_scope: train
  stats_path: outputs_train_on_small_domain/upper_40x20_encoder_convlstm_shuffle_train_val/norm_stats.npz
  temporal_offsets: [-8,-7,-6,-5,-4,-3,-2,-1, 0]
  augment_x_roll: false

model:
  name: UNet_3Layers_EncoderConvLSTM
  in_channels: 72
  out_channels: 1
  base_channels: 128
  kernel_size: 3
  norm: bn
  dropout: 0.25
  activation: silu
  sequence_length: 9
  frame_channels: 8
  convlstm_kernel_size: 3

loss:
  name: huber
  domain_mean_weight: 0.0
  high_y_weight: 0.0
  high_y_eps: 0.00000
  gradient_weight: 0.0
  gradient_periodic_x: true

optimizer:
  name: adamw
  lr: 0.0008306357642686378
  weight_decay: 0.0003

scheduler:
  name: cosine
  min_lr: 0.000001

train:
  epochs: 300
  amp: true
  grad_clip_norm: 1.0
  early_stopping_patience: 15
  checkpoint_dir: outputs_train_on_small_domain/upper_40x20_encoder_convlstm_shuffle_train_val/checkpoints
  best_checkpoint: outputs_train_on_small_domain/upper_40x20_encoder_convlstm_shuffle_train_val/checkpoints/best.pt
  last_checkpoint: outputs_train_on_small_domain/upper_40x20_encoder_convlstm_shuffle_train_val/checkpoints/last.pt
  history_csv: outputs_train_on_small_domain/upper_40x20_encoder_convlstm_shuffle_train_val/history.csv
  config_snapshot: outputs_train_on_small_domain/upper_40x20_encoder_convlstm_shuffle_train_val/config.yaml
