seed: 42
device: auto

data:
  x_path: analysis/no_shuffle_upper40x20_mld_rho_9features/data/X.npy
  y_path: analysis/no_shuffle_upper40x20_mld_rho_9features/data/y.npy
  batch_size: 128
  num_workers: 4
  pin_memory: true
  split:
    train: 0.8
    val: 0.1
    test: 0.1
    shuffle: true
    shuffle_train_val: false
  shuffle_train_loader: false
  normalize_x: true
  normalize_y: true
  stats_scope: train
  stats_path: analysis/no_shuffle_upper40x20_mld_rho_9features/outputs/norm_stats.npz
  temporal_offsets: [-8, -7, -6, -5, -4, -3, -2, -1, 0]
  augment_x_roll: false

model:
  name: UNet_3Layers_ConvLSTM
  in_channels: 81
  out_channels: 1
  base_channels: 128
  kernel_size: 3
  norm: bn
  dropout: 0.25
  activation: silu
  sequence_length: 9
  frame_channels: 9
  convlstm_kernel_size: 3

loss:
  name: huber
  domain_mean_weight: 0.0
  high_y_weight: 0.0
  high_y_eps: 0.00000
  gradient_weight: 0.0
  gradient_periodic_x: true

optimizer:
  name: adamw
  lr: 0.0008306357642686378
  weight_decay: 0.0003

scheduler:
  name: cosine
  min_lr: 0.000001

train:
  epochs: 300
  amp: true
  grad_clip_norm: 1.0
  early_stopping_patience: 15
  checkpoint_dir: analysis/no_shuffle_upper40x20_mld_rho_9features/outputs/checkpoints
  best_checkpoint: analysis/no_shuffle_upper40x20_mld_rho_9features/outputs/checkpoints/best.pt
  last_checkpoint: analysis/no_shuffle_upper40x20_mld_rho_9features/outputs/checkpoints/last.pt
  history_csv: analysis/no_shuffle_upper40x20_mld_rho_9features/outputs/history.csv
  config_snapshot: analysis/no_shuffle_upper40x20_mld_rho_9features/outputs/config.yaml
