seed: 42
device: auto

data:
  x_path: data/X.npy
  y_path: data/y.npy
  batch_size: 64
  num_workers: 4
  pin_memory: true
  split:
    train: 0.8
    val: 0.1
    test: 0.1
    shuffle: false
  shuffle_train_loader: false
  normalize_x: true
  normalize_y: true
  stats_path: outputs/norm_stats.npz

model:
  name: unet
  in_channels: 8
  out_channels: 1
  base_channels: 48
  depth: 4
  bilinear: true
  dropout: 0.05
  activation: silu

loss:
  name: mse

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.00005

scheduler:
  name: cosine
  min_lr: 0.000001

train:
  epochs: 100
  amp: true
  grad_clip_norm: 1.0
  early_stopping_patience: 15
  checkpoint_dir: outputs/checkpoints
  best_checkpoint: outputs/checkpoints/best.pt
  last_checkpoint: outputs/checkpoints/last.pt
  history_csv: outputs/history.csv
