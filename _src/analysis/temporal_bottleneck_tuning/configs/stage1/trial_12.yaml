seed: 42
device: auto
data:
  x_path: analysis/model_analysis/data/X.npy
  y_path: analysis/model_analysis/data/y.npy
  temporal_offsets:
  - -8
  - -7
  - -6
  - -5
  - -4
  - -3
  - -2
  - -1
  - 0
  split:
    train: 0.8
    val: 0.1
    test: 0.1
  batch_size: 64
  num_workers: 4
  pin_memory: true
  normalize_x: true
  normalize_y: true
model:
  input_channels: 8
  latent_channels: 4
  height: 20
  width: 40
  spatial_channels:
  - 32
  - 64
  - 96
  temporal_channels: 96
  temporal_layers: 2
  decoder_channels:
  - 32
  - 16
  dropout: 0.2
  temporal_reduce: final
train:
  epochs: 250
  lr: 0.0003
  weight_decay: 1.0e-05
  patience: 40
  loss: mse
  latent_smooth_weight: 0
  latent_corr_weight: 0
  checkpoint: analysis/temporal_bottleneck_tuning/outputs/stage1/trial_12/temporal_bottleneck.pt
  history_csv: analysis/temporal_bottleneck_tuning/outputs/stage1/trial_12/history.csv
output:
  dir: analysis/temporal_bottleneck_tuning/outputs/stage1/trial_12
  predictions: analysis/temporal_bottleneck_tuning/outputs/stage1/trial_12/test_predictions_denorm.npz
  r2_series: analysis/temporal_bottleneck_tuning/outputs/stage1/trial_12/test_r2_series.csv
  summary: analysis/temporal_bottleneck_tuning/outputs/stage1/trial_12/evaluation_summary.txt
  stats: analysis/temporal_bottleneck_tuning/outputs/stage1/trial_12/norm_stats.npz
