seed: 42
device: auto
data:
  x_path: analysis/model_analysis/data/X.npy
  y_path: analysis/model_analysis/data/y.npy
  temporal_offsets:
  - -4
  - -3
  - -2
  - -1
  - 0
  split:
    train: 0.8
    val: 0.1
    test: 0.1
  batch_size: 64
  num_workers: 4
  pin_memory: true
  normalize_x: true
  normalize_y: true
model:
  input_channels: 8
  latent_channels: 4
  height: 20
  width: 40
  spatial_channels:
  - 24
  - 48
  temporal_channels: 48
  temporal_layers: 1
  decoder_channels:
  - 24
  - 12
  dropout: 0.15
  temporal_reduce: final
train:
  epochs: 250
  lr: 0.001
  weight_decay: 0.0001
  patience: 40
  loss: huber
  latent_smooth_weight: 0
  latent_corr_weight: 0
  checkpoint: analysis/hyperparameter_tunning/outputs_one_at_time/channel_width/channels_small/temporal_bottleneck.pt
  history_csv: analysis/hyperparameter_tunning/outputs_one_at_time/channel_width/channels_small/history.csv
output:
  dir: analysis/hyperparameter_tunning/outputs_one_at_time/channel_width/channels_small
  predictions: analysis/hyperparameter_tunning/outputs_one_at_time/channel_width/channels_small/test_predictions_denorm.npz
  r2_series: analysis/hyperparameter_tunning/outputs_one_at_time/channel_width/channels_small/test_r2_series.csv
  summary: analysis/hyperparameter_tunning/outputs_one_at_time/channel_width/channels_small/evaluation_summary.txt
  stats: analysis/hyperparameter_tunning/outputs_one_at_time/channel_width/channels_small/norm_stats.npz
