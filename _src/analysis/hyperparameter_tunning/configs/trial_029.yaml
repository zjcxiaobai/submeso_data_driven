seed: 42
device: auto
data:
  x_path: analysis/model_analysis/data/X.npy
  y_path: analysis/model_analysis/data/y.npy
  temporal_offsets:
  - -1
  - 0
  split:
    train: 0.8
    val: 0.1
    test: 0.1
  batch_size: 64
  num_workers: 4
  pin_memory: true
  normalize_x: true
  normalize_y: true
model:
  input_channels: 8
  latent_channels: 4
  height: 20
  width: 40
  spatial_channels:
  - 96
  - 192
  - 256
  temporal_channels: 256
  temporal_layers: 3
  decoder_channels:
  - 96
  - 48
  dropout: 0.4
  temporal_reduce: final
train:
  epochs: 250
  lr: 1.807009168876502e-05
  weight_decay: 1.0e-06
  patience: 40
  loss: mse
  latent_smooth_weight: 0
  latent_corr_weight: 0
  checkpoint: analysis/hyperparameter_tunning/outputs/trial_029/temporal_bottleneck.pt
  history_csv: analysis/hyperparameter_tunning/outputs/trial_029/history.csv
output:
  dir: analysis/hyperparameter_tunning/outputs/trial_029
  predictions: analysis/hyperparameter_tunning/outputs/trial_029/test_predictions_denorm.npz
  r2_series: analysis/hyperparameter_tunning/outputs/trial_029/test_r2_series.csv
  summary: analysis/hyperparameter_tunning/outputs/trial_029/evaluation_summary.txt
  stats: analysis/hyperparameter_tunning/outputs/trial_029/norm_stats.npz
