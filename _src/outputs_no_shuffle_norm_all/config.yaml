seed: 42
device: auto
data:
  x_path: data/X.npy
  y_path: data/y.npy
  batch_size: 64
  num_workers: 4
  pin_memory: true
  split:
    train: 0.7
    val: 0.15
    test: 0.15
    shuffle: false
    shuffle_train_val: false
  shuffle_train_loader: false
  normalize_x: true
  normalize_y: true
  stats_scope: all
  stats_path: outputs_no_shuffle_norm_all/norm_stats.npz
  temporal_offsets:
  - 0
  augment_x_roll: false
model:
  name: UNet_3Layers
  in_channels: 8
  out_channels: 1
  base_channels: 256
  kernel_size: 3
  norm: bn
  dropout: 0.1
  activation: silu
loss:
  name: mse
  domain_mean_weight: 0.0
  high_y_weight: 0.0
  high_y_eps: 0.0
  gradient_weight: 0.0
  gradient_periodic_x: true
optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.0003
scheduler:
  name: cosine
  min_lr: 1.0e-06
train:
  epochs: 300
  amp: true
  grad_clip_norm: 1.0
  early_stopping_patience: 15
  checkpoint_dir: /scratch/jczhang/submeso_data_driven/_src/outputs_no_shuffle_norm_all/checkpoints
  best_checkpoint: /scratch/jczhang/submeso_data_driven/_src/outputs_no_shuffle_norm_all/checkpoints/best.pt
  last_checkpoint: /scratch/jczhang/submeso_data_driven/_src/outputs_no_shuffle_norm_all/checkpoints/last.pt
  history_csv: /scratch/jczhang/submeso_data_driven/_src/outputs_no_shuffle_norm_all/history.csv
  config_snapshot: /scratch/jczhang/submeso_data_driven/_src/outputs_no_shuffle_norm_all/config.yaml
