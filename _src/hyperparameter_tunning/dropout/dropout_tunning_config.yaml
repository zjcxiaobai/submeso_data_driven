base_config: configs/unet_no_shuffle_upper_40x20.yaml
summary_csv: hyperparameter_tunning/dropout/dropout_tunning_summary.csv

seed: 42
base_channels: 128
depth: 3
kernel_size: 3
batch_size: 32
norm: gn
dropout_values: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4]

learning_rate: auto
learning_rate_summary_csv: hyperparameter_tunning/learning_rate/learning_rate_random_search_summary.csv
learning_rate_metric: val_r2

loss:
  name: huber

epochs: 300
early_stopping_patience: 15
early_stopping_metric: val_r2
early_stopping_mode: max
