base_config: configs/unet_no_shuffle_upper_40x20.yaml
summary_csv: hyperparameter_tunning/loss_function/loss_function_tunning_summary.csv

seed: 42
base_channels: 128
learning_rate: auto
learning_rate_summary_csv: hyperparameter_tunning/learning_rate/learning_rate_random_search_summary.csv
learning_rate_metric: val_r2

epochs: 300
early_stopping_patience: 15
early_stopping_metric: val_r2
early_stopping_mode: max

loss_functions:
  - name: mse
  - name: mae
  - name: huber
  - name: weighted_mse
    weighted_power: 1.0
    weighted_eps: 0.000001
  - name: gradient_loss
  - name: spectral_loss
  - name: mse_plus_gradient
    gradient_weight: 0.1
